name: Release macOS app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build DMG and zip (Apple Silicon + Intel, unsigned)
        run: npx electron-builder --mac --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          generate_release_notes: true
          body: |
            Unsigned build. On first launch macOS will block it: right-click the app, choose **Open**, then **Open** again.
            Or run `xattr -dr com.apple.quarantine "/Applications/X-T50 Recipe Matcher.app"` once.

            Prefer not to install anything? Use the web app: https://orgrune.github.io/xt50-recipe-matcher/
      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: mac-builds
          path: |
            dist/*.dmg
            dist/*.zip
